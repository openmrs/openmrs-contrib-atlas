# Local development stack. Start with `docker compose up -d`.
#
# - mysql: an Atlas 2.0 database loaded with the 2.0 schema and demo data,
#   used as the source for the migration (migration/).
# - gcs: fake-gcs-server standing in for the public Cloud Storage bucket
#   that holds published snapshots and logos.

services:
  mysql:
    image: mysql:8.4.13
    # The 2.0 dumps use zero dates and utf8 (utf8mb3); relax 8.x defaults so they load as they did on 5.6.
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: atlas-root
      MYSQL_DATABASE: atlasdb
      MYSQL_USER: atlas
      MYSQL_PASSWORD: atlas
    ports:
      - "3306:3306"
    volumes:
      - ./migration/fixtures:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uatlas", "-patlas"]
      interval: 5s
      retries: 20

  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: -scheme http -port 4443 -public-host localhost:4443 -external-url http://localhost:4443
    ports:
      - "4443:4443"
    volumes:
      - ./docker/gcs:/data

volumes:
  mysql-data:
