name: CI

# The deploy-staging job deploys main to atlas-stg.openmrs.org after the tests pass.
# Authenticates to Google Cloud with Workload Identity Federation (no stored keys).
# Repository variables to set (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJECT          Google Cloud project id
#   GCP_REGION           Cloud Run / Artifact Registry region, e.g. us-central1
#   GCP_WIF_PROVIDER     projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOY_SA        deploy service account email
#   STAGING_DATA_URL     public base URL of the staging bucket, e.g. https://storage.googleapis.com/openmrs-atlas-stg
#   KEYCLOAK_ISSUER      Keycloak realm URL, e.g. https://id-stg.openmrs.org/realms/openmrs
#   KEYCLOAK_CLIENT_ID   the Atlas client in that realm, e.g. atlas
#   STAGING_EMAIL_ALLOWLIST  comma-separated addresses staging may email; unset delivers to no one
#   STAGING_NOTICE_EMAIL     optional address for new-marker notices on staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w web playwright install --with-deps chromium
      - run: npm run e2e -w web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  deploy-staging:
    # Deploys pushes to main once both test jobs pass. Skipped until the Google Cloud
    # project is set up (the GCP_* repository variables exist).
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/atlas/atlas-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the service image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -f service/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy the service to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: atlas-service-stg
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # SHEET_ID, BUCKET, SCHEDULER_SA_EMAIL and SERVICE_URL are set once on the service;
          # PUBLISH_SECRET comes from Secret Manager. See service/README.md.
          # One instance, so its in-memory queue can serialise every sheet write.
          flags: --max-instances=1
          # Staging must never mail real implementers: with no allowlist variable it delivers
          # to no one ("none" matches no address).
          env_vars: |
            KEYCLOAK_ISSUER=${{ vars.KEYCLOAK_ISSUER }}
            KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_CLIENT_ID }}
            KEYCLOAK_SERVICE_CLIENT_ID=atlas-service
            SITE_URL=https://atlas-stg.openmrs.org
            EMAIL_FROM=OpenMRS Atlas <atlas-noreply@openmrs.org>
            EMAIL_ALLOWLIST=${{ vars.STAGING_EMAIL_ALLOWLIST || 'none' }}
            NOTICE_EMAIL=${{ vars.STAGING_NOTICE_EMAIL }}
          secrets: |
            KEYCLOAK_SERVICE_CLIENT_SECRET=atlas-keycloak-service-secret:latest
            MANDRILL_API_KEY=atlas-mandrill-api-key:latest
            LINK_SIGNING_KEY=atlas-link-signing-key:latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the map site
        run: npm run build -w web
        env:
          VITE_DATA_BASE_URL: ${{ vars.STAGING_DATA_URL }}
          VITE_KEYCLOAK_ISSUER: ${{ vars.KEYCLOAK_ISSUER }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
          # No VITE_GA_ID on staging, so analytics stays off.
      - name: Deploy the map site to Firebase Hosting
        run: npx firebase-tools@15.34.2 deploy --only hosting:staging --project "${{ vars.GCP_PROJECT }}" --non-interactive
