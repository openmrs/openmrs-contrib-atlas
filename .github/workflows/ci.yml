name: CI

# Tests every pull request and push. After the tests pass:
#   - a push to main (or "Run workflow" on main) deploys staging, atlas-stg.openmrs.org;
#   - a release tag such as 3.0 (or "Run workflow" on an older tag, to roll back) deploys
#     production, atlas.openmrs.org, once release-guard passes and a maintainer approves.
# The deploy steps are in deploy.yml; the settings are in the GitHub Environments `staging` and
# `production`. See infra/README.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w web playwright install --with-deps chromium
      - run: npm run e2e -w web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  deploy-staging:
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging

  release-guard:
    # Only a tag named <major>.<minor> (3.0, 3.12) on a commit in main is a release. Runs before
    # the production approval, so any other tag fails here and never asks for one.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is a release on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag (expected <major>.<minor>, like 3.0); nothing is deployed."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main; nothing is deployed."
            exit 1
          fi
          echo "$TAG is a release on main."

  deploy-production:
    needs: [check, e2e, release-guard]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production

  release:
    # Records the release on GitHub once production runs it. A redeploy (rollback) of a tag that
    # already has a release leaves it alone.
    needs: deploy-production
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
