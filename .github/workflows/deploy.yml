name: Deploy

# Builds the Atlas image for one environment and pushes it to Docker Hub as openmrsinfra/atlas.
# Called by ci.yml, never run on its own. The host (goba, on Jetstream 2) runs the image with its
# own settings and secrets, and picks up a new image when its tag changes; see infra/README.md.
#
#   staging     -> openmrsinfra/atlas:staging and :staging-<sha>
#   production  -> openmrsinfra/atlas:production, :latest and :<release>, such as :4.0
#
# The map site's settings come from the GitHub Environment named by `environment` (Settings >
# Environments). There are deliberately no repository variables, so one environment can never
# borrow another's value. Only the production job, behind the environment's approval and the
# release-guard, may push the production tags.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check the environment's settings and choose the tags
        id: settings
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SITE_URL: ${{ vars.SITE_URL }}
          KEYCLOAK_ISSUER: ${{ vars.KEYCLOAK_ISSUER }}
          KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
          GA_ID: ${{ vars.GA_ID }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          IMAGE: openmrsinfra/atlas
        run: |
          required="SITE_URL KEYCLOAK_ISSUER KEYCLOAK_CLIENT_ID"
          if [ "$ENVIRONMENT" = production ]; then required="$required GA_ID"; fi
          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The $ENVIRONMENT environment is missing:$missing"
            exit 1
          fi

          # The tags are chosen here, from the environment, never from a setting.
          case "$ENVIRONMENT" in
            staging)
              tags="$IMAGE:staging,$IMAGE:staging-${SHA::7}"
              ga_id=""
              ;;
            production)
              # Production is only ever a release tag (ci.yml's release-guard checks it is one).
              if [ "$REF_TYPE" != tag ] || ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Production is pushed only from a release tag, not $REF_TYPE $REF_NAME"
                exit 1
              fi
              tags="$IMAGE:production,$IMAGE:latest,$IMAGE:$REF_NAME"
              ga_id="$GA_ID"
              ;;
            *)
              echo "::error::Unknown environment '$ENVIRONMENT': expected staging or production"
              exit 1
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "ga_id=$ga_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.settings.outputs.tags }}
          # Analytics only in production; the Dockerfile enforces it too.
          build-args: |
            ATLAS_ENVIRONMENT=${{ inputs.environment }}
            ATLAS_COMMIT=${{ github.sha }}
            VITE_SITE_URL=${{ vars.SITE_URL }}
            VITE_KEYCLOAK_ISSUER=${{ vars.KEYCLOAK_ISSUER }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_CLIENT_ID }}
            VITE_GA_ID=${{ steps.settings.outputs.ga_id }}
          cache-from: type=gha,scope=${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}
